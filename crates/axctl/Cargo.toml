[package]
name = "axctl"
version.workspace = true
edition.workspace = true
description = "An all-in-one development tool for axum projects (dev / build / serve / package / info)"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["axum", "cli", "dev-tools", "vite", "web"]
categories = ["command-line-utilities", "development-tools"]

# 编译成名为 axctl 的单个二进制，同时让 `cargo axctl` 自动可用
[[bin]]
name = "axctl"
path = "src/main.rs"

[dependencies]
axctl-core = { path = "../axctl-core" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "process", "signal", "time", "sync", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
cargo_metadata = "0.19"
notify-debouncer-full = "0.3"
axum = { version = "0.8", features = ["ws"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "json"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
console = "0.15"

# Unix 终止进程树：pgrep -P 递归收集后代 + libc::kill 逐个发信号
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
