[package]
name = "axctl-core"
version.workspace = true
edition.workspace = true
description = "Core library for axctl: embed and serve frontend assets in axum projects"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["axum", "embed", "static", "spa"]
categories = ["web-programming", "development-tools"]

[dependencies]
include_dir = "0.7"
axum = "0.8"
mime_guess = "2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["macros", "rt"] }
http-body-util = "0.1"
