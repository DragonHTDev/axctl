[package]
name = "axctl"
version = "0.1.0"
edition = "2021"
description = "An all-in-one development tool for axum projects (dev / build / serve / package / info)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dragonhtdev/axctl"
readme = "README.md"
keywords = ["axum", "cli", "dev-tools", "vite", "web"]
categories = ["command-line-utilities", "development-tools"]

# 编译成名为 axctl 的单个二进制，同时让 `cargo axctl` 自动可用
[[bin]]
name = "axctl"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "process", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
notify-debouncer-full = "0.3"
rust-embed = "8"
