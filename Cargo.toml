[workspace]
members = ["crates/axctl", "crates/axctl-core"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dragonhtdev/axctl"

# 统一的 release 优化配置
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
