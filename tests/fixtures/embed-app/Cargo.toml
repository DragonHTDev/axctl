# embed fixture：验证 axctl-core::frontend! 宏 + FrontendAssets 包装。
#
# 独立 crate（空 [workspace] 自绝），path 依赖 axctl-core + include_dir。
# 注意：include_dir! 宏展开的代码引用 `include_dir::` 绝对路径，调用方
# 必须直接依赖 include_dir（与 axum-vite 的 embedded_dir! 同款要求）。
#
# 验证方式：
#   cargo run --release   # release：frontend! 展开为内嵌，static/ 烙进二进制
#   cargo run             # debug：frontend! 展开为 empty（dev 前端归 vite）
#
# CI 不跑本 fixture（无 release-profile 断言通道）；release 内嵌读取路径
# 已由 axctl-core 的 embed.rs #[cfg(test)] 覆盖（include_dir! 直连本 static），
# 本 binary 用于发货前手动验证 frontend! 宏的 release/debug 分支。
#
# 目录叫 static/ 而非 dist/：tests/fixtures/*/dist/ 被 .gitignore 排除
# （vite 产物目录约定）；embed fixture 内容需入库，故用 static/。
[workspace]

[package]
name = "axctl-embed-fixture"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
axctl-core = { path = "../../../crates/axctl-core" }
include_dir = "0.7"
